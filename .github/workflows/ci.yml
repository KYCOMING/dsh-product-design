name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Verify committed bundles are current
        run: git diff --exit-code -- client.js index.js

      - name: Syntax check
        run: pnpm run syntax

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test
